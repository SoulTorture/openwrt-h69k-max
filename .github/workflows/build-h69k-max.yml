# =============================================================================
# HINLINK H69K-MAX (RK3568) OpenWrt 云编译  —— GitHub Actions
#
# 源码: coolsnowwolf/lede (Lean) master
# 设备: rockchip/armv8 -> hinlink_opc-h69k  (DTS rk3568-opc-h69k)
# U-Boot: generic-rk3568 (idbloader @0x40, u-boot.itb @0x4000)
#
# 用法: Actions -> "Build OpenWrt H69K-MAX" -> Run workflow
# 产物: openwrt-*-rockchip-armv8-hinlink_opc-h69k-*.img.gz
#
# 说明: OpenWrt/LEDE 只能在 Linux 下编译 (大小写敏感文件系统 + POSIX 工具链),
#       因此用 GitHub 的 Ubuntu runner 编译, 本机无需安装 Linux。
# =============================================================================
name: Build OpenWrt H69K-MAX

on:
  workflow_dispatch:
    inputs:
      lede_branch:
        description: 'LEDE 分支'
        required: true
        default: 'master'
        type: string
      kernel:
        description: '内核版本'
        required: true
        default: '6.18'
        type: choice
        options: ['6.18', '6.12', '6.6']
      rootfs_size_mb:
        description: 'rootfs 分区大小 (MB, eMMC 32GB 可给 8192)'
        required: true
        default: '4020'
        type: string
      use_cache:
        description: '启用 ccache 缓存 (重编译更快)'
        required: true
        default: true
        type: boolean
      make_release:
        description: '把固件发布到 Release (需要 contents: write)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: ${{ github.event.inputs.lede_branch || 'master' }}
  KERNEL: ${{ github.event.inputs.kernel || '6.18' }}
  ROOTFS_MB: ${{ github.event.inputs.rootfs_size_mb || '4020' }}
  DEVICE: hinlink_opc-h69k

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build H69K-MAX
    timeout-minutes: 350

    steps:
      - name: 检出本仓库 (含 .config)
        uses: actions/checkout@v4
        with:
          path: builder

      - name: 安装编译依赖
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged \
            help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pkg-resources qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge -y
          sudo -E apt-get -qq clean
          df -hT

      - name: 克隆 LEDE 源码
        run: |
          set -e
          df -hT
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "LEDE commit: $(git rev-parse HEAD)" | tee ../lede-commit.txt
          git log -1 --format='%H %ci %s' | tee -a ../lede-commit.txt

      - name: ccache 缓存
        if: ${{ !inputs.use_cache == false }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-h69k-${{ github.event.inputs.kernel }}-${{ github.run_id }}
          restore-keys: |
            ccache-h69k-${{ github.event.inputs.kernel }}-
            ccache-h69k-

      - name: 配置加速 (ccache)
        if: ${{ inputs.use_cache != false }}
        run: |
          echo "CONFIG_CCACHE=y" >> builder/config/h69k-max.config
          ccache --max-size=5G || true
          ccache -z || true

      - name: 生成 .config (设备 + 5G 模块)
        working-directory: openwrt
        run: |
          set -e
          cp ../builder/config/h69k-max.config .config
          # 追加 5G / RM520N-GL 相关选项
          if [ -f ../builder/config/5g-rm520n.config ]; then
            printf '\n# ==== appended: 5g-rm520n.config ====\n' >> .config
            cat ../builder/config/5g-rm520n.config >> .config
          fi
          # 内核版本
          sed -i "/^CONFIG_LINUX_/d" .config
          echo "CONFIG_LINUX_${KERNEL//./_}=y" >> .config
          # rootfs 分区大小
          sed -i "/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d" .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_MB}" >> .config
          echo "--- 关键配置 (追加前) ---"
          grep -E 'CONFIG_LINUX_|CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ROOTFS_PARTSIZE)|CONFIG_TARGET_rockchip' .config || true
          make defconfig

      - name: 校验关键配置符号
        working-directory: openwrt
        run: |
          set -e
          # 从本仓库两个 config 中提取所有请求的符号
          cat ../builder/config/h69k-max.config ../builder/config/5g-rm520n.config \
            | sed -n 's/^\(CONFIG_[A-Za-z0-9_-]*\)=y$/\1/p' | sort -u > /tmp/wanted.txt
          echo "本仓库请求的符号数: $(wc -l < /tmp/wanted.txt)"
          printf '%s\n' $(cat /tmp/wanted.txt) > /tmp/requested.txt

          # 包级关键项(除 TARGET 外)单独硬校验, 缺一不可
          hard_list='CONFIG_PACKAGE_u-boot-generic-rk3568 CONFIG_PACKAGE_rkbin-rk3568 CONFIG_PACKAGE_kmod-mt7916-firmware CONFIG_PACKAGE_kmod-mt7915e CONFIG_PACKAGE_kmod-hwmon-pwmfan'

          hard_fail=0
          warn_count=0

          while read -r sym; do
            [ -z "$sym" ] && continue
            case " $hard_list " in
              *" $sym "*) is_hard=1 ;;
              *) case "$sym" in CONFIG_TARGET_*) is_hard=1 ;; *) is_hard=0 ;; esac ;;
            esac
            if grep -q "^${sym}=y$" .config; then
              echo "[OK] ${sym}"
            elif [ "$is_hard" -eq 1 ]; then
              echo "::error::必须项缺失: ${sym}"
              hard_fail=$((hard_fail+1))
            else
              echo "::warning::可选包未生效(该源码树可能没有此包名): ${sym}"
              warn_count=$((warn_count+1))
            fi
          done < /tmp/requested.txt

          echo "=============================================="
          echo "必须项缺失: ${hard_fail}   可选包未生效: ${warn_count}"
          echo "=============================================="

          if [ "$hard_fail" -ne 0 ]; then
            echo ":::: 实际生效的相关配置 (用于比对) ::::"
            grep -E 'mt7915e|mt7916|mhi|qmi|mbim|hinlink|rk3568|fancontrol|3ginfo|atinout|modemband|modeminfo|thermal' .config | sort || true
            exit 1
          fi

      - name: 下载源码包 (make download)
        working-directory: openwrt
        run: |
          set -e
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件 (make -j)
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log
          echo "编译结束, 退出码: $?"

      - name: 收集固件
        run: |
          set -e
          mkdir -p out
          find openwrt/bin/targets/rockchip/armv8 -maxdepth 1 \
            \( -name '*.img.gz' -o -name '*.img' -o -name '*.itb' -o -name '*.bin' -o -name '*.manifest' -o -name '*sha256sums*' -o -name 'profiles.json' \) \
            -exec cp -v {} out/ \; || true
          # 同时保留 sysupgrade 包清单以便核对
          find openwrt/bin/targets/rockchip/armv8/packages -maxdepth 1 -name '*.manifest' \
            -exec cp -v {} out/ \; 2>/dev/null || true
          cp lede-commit.txt out/ 2>/dev/null || true
          echo "=== 产物 ==="
          ls -lh out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传固件 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-h69k-max-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

      - name: 上传编译日志 (失败时用于排错)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            openwrt/build.log
            openwrt/.config
          if-no-files-found: ignore

      - name: 发布到 Release
        if: ${{ inputs.make_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h69k-max-${{ github.run_number }}
          name: OpenWrt H69K-MAX (kernel ${{ github.event.inputs.kernel }}) #${{ github.run_number }}
          body: |
            HINLINK H69K-MAX (RK3568) OpenWrt 固件
            - 源码: coolsnowwolf/lede @ ${{ github.event.inputs.lede_branch }}
            - 设备: rockchip/armv8 -> hinlink_opc-h69k
            - 内核: Linux ${{ github.event.inputs.kernel }}
            - rootfs 分区: ${{ github.event.inputs.rootfs_size_mb }} MB
            - 无线: MT7916 (mt7915e + mt7916-firmware)
            - 5G: Quectel RM520N-GL (USB QMI/MBIM + PCIe MHI 双栈)
            详见仓库 README 刷机说明。
          files: out/*
          fail_on_unmatched_files: false
